name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.14" }
      # aiogeodrops comes from the manifest, so CI tests the version users get.
      - run: pip install -r requirements-dev.txt $(jq -r '.requirements[]' custom_components/geodrops/manifest.json)
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q --cov=custom_components/geodrops --cov-report=term-missing --cov-fail-under=100
