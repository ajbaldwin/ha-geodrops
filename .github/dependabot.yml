version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      dev:
        patterns: ["*"]
    ignore:
      # Newer releases track HA 2026.10+, which moved config-flow schemas to
      # probatio. Hold until the minimum HA version is raised to match.
      - dependency-name: "pytest-homeassistant-custom-component"
